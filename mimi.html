<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mimi ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Italiana&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf3ee;
    --cream-deep: #f3e6da;
    --blush: #f5d5cf;
    --rose: #b91c2c;
    --rose-deep: #7a1220;
    --rose-bright: #d94557;
    --rose-light: #e89099;
    --leaf: #5a7a4f;
    --leaf-deep: #3d5638;
    --gold: #b08d57;
    --ink: #2b1810;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(ellipse at top, #faf3ee 0%, #f3e6da 60%, #ecd9c8 100%);
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(217, 69, 87, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(176, 141, 87, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(122, 18, 32, 0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .corner {
    position: fixed;
    width: 95px;
    height: 95px;
    z-index: 1;
    opacity: 0.55;
    pointer-events: none;
  }
  .corner.tl { top: 20px; left: 20px; }
  .corner.tr { top: 20px; right: 20px; }
  .corner.bl { bottom: 20px; left: 20px; }
  .corner.br { bottom: 20px; right: 20px; }

  .scene {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem 3rem;
    transition: opacity 2s ease;
  }

  .scene.dim { opacity: 0.18; }

  .eyebrow {
    font-family: 'Italiana', serif;
    font-size: clamp(1.1rem, 1.8vw, 1.4rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--rose-deep);
    opacity: 0.85;
    margin-bottom: 0.85rem;
    text-indent: 0.25em;
  }

  .eyebrow::after {
    content: '';
    display: block;
    width: 50px;
    height: 1px;
    background: var(--rose-deep);
    opacity: 0.4;
    margin: 0.85rem auto 0;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.3rem, 2.4vw, 1.85rem);
    color: var(--ink);
    opacity: 0.75;
    margin-bottom: 2.5rem;
    text-align: center;
    max-width: 620px;
    line-height: 1.4;
  }

  .rose-stage {
    width: min(340px, 90vw);
    height: 380px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    margin-bottom: 1.5rem;
  }

  .rose-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 20px 30px rgba(122, 18, 32, 0.08));
  }

  .rose-svg > * {
    transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center bottom;
  }

  @keyframes growIn {
    from { transform: scaleY(0.3) translateY(20px); opacity: 0; }
    to { transform: scaleY(1) translateY(0); opacity: 1; }
  }

  .rose-svg .new {
    animation: growIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center bottom;
  }

  .click-button {
    background: transparent;
    border: 1px solid var(--rose-deep);
    color: var(--rose-deep);
    padding: 0.95rem 2.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(4px);
    background-color: rgba(250, 243, 238, 0.4);
  }

  .click-button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--rose-deep) 0%, var(--rose) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: -1;
  }

  .click-button:hover {
    color: var(--cream);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(122, 18, 32, 0.25);
    border-color: var(--rose-deep);
  }

  .click-button:hover::before {
    opacity: 1;
  }

  .click-button:active {
    transform: translateY(0) scale(0.97);
  }

  .click-button.bloomed {
    border-color: var(--rose);
    color: var(--cream);
    background-color: var(--rose-deep);
    animation: pulseGlow 2s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(185, 28, 44, 0.4); }
    50% { box-shadow: 0 0 0 18px rgba(185, 28, 44, 0); }
  }

  .progress {
    margin-top: 1.5rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .pip {
    width: 22px;
    height: 1px;
    background: var(--rose-deep);
    opacity: 0.2;
    transition: all 0.5s ease;
  }

  .pip.filled {
    opacity: 1;
    background: var(--rose);
    height: 2px;
  }

  .falling {
    position: fixed;
    top: -60px;
    z-index: 30;
    pointer-events: none;
    will-change: transform;
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-60px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(var(--end-rot, 720deg)); }
  }

  .finale {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at center, rgba(250, 243, 238, 0.96) 0%, rgba(243, 230, 218, 0.96) 70%, rgba(236, 217, 200, 0.97) 100%);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    padding: 2rem 1.5rem;
    text-align: center;
  }

  .finale.show {
    opacity: 1;
    pointer-events: auto;
  }

  .finale-ornament {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose-deep) 50%, transparent);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeIn 1.2s ease 0.8s forwards;
  }

  .finale-eyebrow {
    font-family: 'Italiana', serif;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
    text-indent: 0.55em;
    opacity: 0;
    animation: fadeIn 1.2s ease 1.2s forwards;
  }

  .finale-headline {
    font-family: 'Italiana', serif;
    font-size: clamp(2.2rem, 6.5vw, 5rem);
    color: var(--rose-deep);
    letter-spacing: 0.02em;
    line-height: 1.1;
    margin-bottom: 2rem;
    opacity: 0;
    transform: translateY(30px);
    animation: revealUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
    max-width: 900px;
  }

  .finale-headline em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--rose);
  }

  .finale-message {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.15rem, 2.4vw, 1.7rem);
    color: var(--ink);
    max-width: 720px;
    line-height: 1.55;
    opacity: 0;
    transform: translateY(20px);
    animation: revealUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) 2.6s forwards;
  }

  .finale-message strong {
    font-style: normal;
    font-weight: 500;
    color: var(--rose-deep);
  }

  .finale-signature {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-top: 3rem;
    opacity: 0;
    animation: fadeIn 1.5s ease 3.8s forwards;
  }

  .finale-signature::before,
  .finale-signature::after {
    content: '';
    display: inline-block;
    width: 30px;
    height: 1px;
    background: var(--gold);
    vertical-align: middle;
    margin: 0 1rem;
    opacity: 0.6;
  }

  .heart {
    color: var(--rose);
    display: inline-block;
    animation: heartbeat 1.6s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }

  @keyframes revealUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .replay {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: transparent;
    border: 1px solid var(--rose-deep);
    color: var(--rose-deep);
    padding: 0.6rem 1.2rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    z-index: 50;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
    background-color: rgba(250, 243, 238, 0.5);
  }

  .replay.show {
    opacity: 0.6;
    animation: fadeIn 1s ease 5s forwards;
  }

  .replay:hover {
    opacity: 1;
    background: var(--rose-deep);
    color: var(--cream);
  }

  @media (max-width: 600px) {
    .corner { width: 60px; height: 60px; }
    .corner.tl, .corner.tr { top: 12px; }
    .corner.bl, .corner.br { bottom: 12px; }
    .corner.tl, .corner.bl { left: 12px; }
    .corner.tr, .corner.br { right: 12px; }
    .scene { padding: 3rem 1rem 2rem; }
  }
</style>
</head>
<body>

  <ellipse cx="70" cy="68" rx="10" ry="4" fill="#5a7a4f" opacity="0.7" transform="rotate(30 70 68)"/>

  <path d="M 60 95 Q 58 75 60 55" stroke="#5a7a4f" stroke-width="1.5" fill="none" opacity="0.7"/>
  <ellipse cx="50" cy="78" rx="10" ry="4" fill="#5a7a4f" opacity="0.7" transform="rotate(-30 50 78)"/>
  <ellipse cx="70" cy="68" rx="10" ry="4" fill="#5a7a4f" opacity="0.7" transform="rotate(30 70 68)"/>

  </g>
</svg>

<div class="scene" id="scene">
  <div class="eyebrow">For My Mimi</div>
  <div class="subtitle">You are the light that shines through even on the darkest of days</div>

  <div class="rose-stage">
    <svg class="rose-svg" id="roseSvg" viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="petalGrad" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#d94557"/>
          <stop offset="55%" stop-color="#b91c2c"/>
          <stop offset="100%" stop-color="#7a1220"/>
        </radialGradient>
        <radialGradient id="petalGradInner" cx="50%" cy="40%">
          <stop offset="0%" stop-color="#e85a6e"/>
          <stop offset="100%" stop-color="#a01a2a"/>
        </radialGradient>
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6b8a5f"/>
          <stop offset="100%" stop-color="#3d5638"/>
        </linearGradient>
        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3d5638"/>
          <stop offset="50%" stop-color="#5a7a4f"/>
          <stop offset="100%" stop-color="#3d5638"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <button class="click-button" id="clickBtn">click on me to give me love</button>

  <div class="progress" id="progress">
    <span class="pip"></span>
    <span class="pip"></span>
    <span class="pip"></span>
    <span class="pip"></span>
    <span class="pip"></span>
  </div>
</div>

<div class="finale" id="finale">
  <div class="finale-ornament"></div>
  <div class="finale-eyebrow">Four Years &nbsp;·&nbsp; Forever to Go</div>
  <h1 class="finale-headline">Happy 4 Years, <em>Mimi!</em></h1>
  <p class="finale-message">
    I love you so much and feel so lucky to be able to call you my <strong>Wife</strong> <span class="heart">♥</span>
  </p>
  <div class="finale-signature">forever yours</div>
</div>

<button class="replay" id="replayBtn">replay ✿</button>

<script>
  const STAGES = 5;
  let stage = 0;
  let finaleTriggered = false;

  const roseSvg = document.getElementById('roseSvg');
  const button = document.getElementById('clickBtn');
  const scene = document.getElementById('scene');
  const finale = document.getElementById('finale');
  const replayBtn = document.getElementById('replayBtn');
  const pips = document.querySelectorAll('.pip');

  const defs = roseSvg.querySelector('defs').outerHTML;

  function drawStage(s) {
    let inner = defs;
    inner += `<ellipse cx="160" cy="372" rx="${60 + s * 12}" ry="5" fill="rgba(75,67,40,0.18)"/>`;

    if (s === 0) {
      inner += `
        <g class="new">
          <path d="M 160 372 L 160 358" stroke="url(#stemGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
          <ellipse cx="153" cy="356" rx="7" ry="3.5" fill="url(#leafGrad)" transform="rotate(-35 153 356)"/>
          <ellipse cx="167" cy="356" rx="7" ry="3.5" fill="url(#leafGrad)" transform="rotate(35 167 356)"/>
        </g>
      `;
    } else if (s === 1) {

      inner += `
        <path d="M 160 372 Q 158 340 160 310" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="148" cy="345" rx="11" ry="5" fill="url(#leafGrad)" transform="rotate(-25 148 345)"/>
        <ellipse cx="172" cy="332" rx="11" ry="5" fill="url(#leafGrad)" transform="rotate(25 172 332)"/>
        <g class="new">
          <circle cx="160" cy="308" r="4" fill="#7a1220"/>
        </g>
      `;
    } else if (s === 2) {
      inner += `
        <path d="M 160 372 Q 156 320 160 260" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="143" cy="340" rx="15" ry="6" fill="url(#leafGrad)" transform="rotate(-25 143 340)"/>
        <ellipse cx="178" cy="318" rx="15" ry="6" fill="url(#leafGrad)" transform="rotate(25 178 318)"/>
        <ellipse cx="148" cy="295" rx="12" ry="5" fill="url(#leafGrad)" transform="rotate(-20 148 295)"/>
        <g class="new">
          <ellipse cx="160" cy="255" rx="8" ry="13" fill="#7a1220"/>
          <path d="M 154 245 Q 160 240 166 245 Q 162 248 160 248 Q 158 248 154 245" fill="#5a7a4f"/>
        </g>
      `;
    } else if (s === 3) {
      inner += `
        <path d="M 160 372 Q 154 305 160 220" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="140" cy="335" rx="18" ry="7" fill="url(#leafGrad)" transform="rotate(-25 140 335)"/>
        <ellipse cx="182" cy="310" rx="18" ry="7" fill="url(#leafGrad)" transform="rotate(25 182 310)"/>
        <ellipse cx="146" cy="280" rx="14" ry="6" fill="url(#leafGrad)" transform="rotate(-22 146 280)"/>
        <ellipse cx="178" cy="255" rx="14" ry="6" fill="url(#leafGrad)" transform="rotate(22 178 255)"/>
        <g class="new">
          <!-- cute round bud -->
          <ellipse cx="160" cy="215" rx="16" ry="20" fill="url(#petalGrad)"/>
          <ellipse cx="158" cy="212" rx="11" ry="15" fill="url(#petalGradInner)"/>
          <ellipse cx="156" cy="210" rx="6" ry="9" fill="#a01a2a" opacity="0.7"/>
          <!-- highlight -->
          <ellipse cx="153" cy="208" rx="2.5" ry="4" fill="#f5a3ad" opacity="0.6"/>
          <!-- leafy calyx tips -->
          <path d="M 150 200 Q 154 195 158 200" stroke="#5a7a4f" stroke-width="1.5" fill="#5a7a4f"/>
          <path d="M 162 200 Q 166 195 170 200" stroke="#5a7a4f" stroke-width="1.5" fill="#5a7a4f"/>
        </g>
      `;
    } else if (s === 4) {
      inner += `
        <path d="M 160 372 Q 154 295 160 195" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <ellipse cx="138" cy="332" rx="20" ry="8" fill="url(#leafGrad)" transform="rotate(-25 138 332)"/>
        <ellipse cx="184" cy="305" rx="20" ry="8" fill="url(#leafGrad)" transform="rotate(25 184 305)"/>
        <ellipse cx="143" cy="270" rx="16" ry="7" fill="url(#leafGrad)" transform="rotate(-22 143 270)"/>
        <ellipse cx="180" cy="240" rx="16" ry="7" fill="url(#leafGrad)" transform="rotate(22 180 240)"/>
        <ellipse cx="150" cy="220" rx="12" ry="6" fill="url(#leafGrad)" transform="rotate(-18 150 220)"/>
        <g class="new">
          <!-- partial bloom — opening petals around a center -->
          <g transform="translate(160 188)">
            <!-- 4 outer opening petals -->
            <g transform="rotate(-50)"><ellipse cx="0" cy="-16" rx="13" ry="17" fill="url(#petalGrad)"/></g>
            <g transform="rotate(50)"><ellipse cx="0" cy="-16" rx="13" ry="17" fill="url(#petalGrad)"/></g>
            <g transform="rotate(-130)"><ellipse cx="0" cy="-14" rx="12" ry="15" fill="#7a1220"/></g>
            <g transform="rotate(130)"><ellipse cx="0" cy="-14" rx="12" ry="15" fill="#7a1220"/></g>
            <!-- center bud still partly closed -->
            <ellipse cx="0" cy="-2" rx="13" ry="16" fill="url(#petalGradInner)"/>
            <ellipse cx="-2" cy="-4" rx="7" ry="11" fill="#a01a2a"/>
            <ellipse cx="0" cy="0" rx="3" ry="5" fill="#4a0810"/>
            <!-- highlight -->
            <ellipse cx="-4" cy="-7" rx="2.5" ry="4" fill="#f5a3ad" opacity="0.6"/>
          </g>
        </g>
      `;
    } else {
      inner += `
        <path d="M 160 372 Q 154 280 160 170" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <ellipse cx="135" cy="328" rx="22" ry="9" fill="url(#leafGrad)" transform="rotate(-25 135 328)"/>
        <ellipse cx="186" cy="298" rx="22" ry="9" fill="url(#leafGrad)" transform="rotate(25 186 298)"/>
        <ellipse cx="140" cy="262" rx="18" ry="8" fill="url(#leafGrad)" transform="rotate(-22 140 262)"/>
        <ellipse cx="182" cy="232" rx="18" ry="8" fill="url(#leafGrad)" transform="rotate(22 182 232)"/>
        <ellipse cx="148" cy="208" rx="14" ry="6.5" fill="url(#leafGrad)" transform="rotate(-18 148 208)"/>
        <!-- little leafy bracts under bloom -->
        <ellipse cx="145" cy="183" rx="9" ry="4" fill="#5a7a4f" transform="rotate(-30 145 183)"/>
        <ellipse cx="175" cy="183" rx="9" ry="4" fill="#5a7a4f" transform="rotate(30 175 183)"/>
        <g class="new">
          <!-- cute full bloom — radial rounded petals -->
          <g transform="translate(160 155)">
            <!-- outer ring: 6 plump petals -->
            <g transform="rotate(0)"><ellipse cx="0" cy="-32" rx="18" ry="24" fill="#a01a2a"/></g>
            <g transform="rotate(60)"><ellipse cx="0" cy="-32" rx="18" ry="24" fill="#a01a2a"/></g>
            <g transform="rotate(120)"><ellipse cx="0" cy="-32" rx="18" ry="24" fill="#a01a2a"/></g>
            <g transform="rotate(180)"><ellipse cx="0" cy="-32" rx="18" ry="24" fill="#a01a2a"/></g>
            <g transform="rotate(240)"><ellipse cx="0" cy="-32" rx="18" ry="24" fill="#a01a2a"/></g>
            <g transform="rotate(300)"><ellipse cx="0" cy="-32" rx="18" ry="24" fill="#a01a2a"/></g>
            <!-- middle ring: 6 brighter petals offset by 30deg -->
            <g transform="rotate(30)"><ellipse cx="0" cy="-22" rx="14" ry="20" fill="url(#petalGrad)"/></g>
            <g transform="rotate(90)"><ellipse cx="0" cy="-22" rx="14" ry="20" fill="url(#petalGrad)"/></g>
            <g transform="rotate(150)"><ellipse cx="0" cy="-22" rx="14" ry="20" fill="url(#petalGrad)"/></g>
            <g transform="rotate(210)"><ellipse cx="0" cy="-22" rx="14" ry="20" fill="url(#petalGrad)"/></g>
            <g transform="rotate(270)"><ellipse cx="0" cy="-22" rx="14" ry="20" fill="url(#petalGrad)"/></g>
            <g transform="rotate(330)"><ellipse cx="0" cy="-22" rx="14" ry="20" fill="url(#petalGrad)"/></g>
            <!-- inner ring: 5 small petals around center -->
            <g transform="rotate(0)"><ellipse cx="0" cy="-13" rx="10" ry="14" fill="url(#petalGradInner)"/></g>
            <g transform="rotate(72)"><ellipse cx="0" cy="-13" rx="10" ry="14" fill="url(#petalGradInner)"/></g>
            <g transform="rotate(144)"><ellipse cx="0" cy="-13" rx="10" ry="14" fill="url(#petalGradInner)"/></g>
            <g transform="rotate(216)"><ellipse cx="0" cy="-13" rx="10" ry="14" fill="url(#petalGradInner)"/></g>
            <g transform="rotate(288)"><ellipse cx="0" cy="-13" rx="10" ry="14" fill="url(#petalGradInner)"/></g>
            <!-- center swirl -->
            <circle cx="0" cy="0" r="11" fill="#a01a2a"/>
            <circle cx="0" cy="0" r="8" fill="#7a1220"/>
            <path d="M -4 -2 Q 0 -6 4 -3 Q 6 1 3 4 Q -1 6 -4 3 Q -6 0 -4 -2 Z" fill="#4a0810"/>
            <!-- cute highlights / blush -->
            <ellipse cx="-22" cy="-30" rx="5" ry="7" fill="#f5a3ad" opacity="0.55" transform="rotate(-30)"/>
            <ellipse cx="20" cy="-32" rx="4" ry="6" fill="#f5a3ad" opacity="0.55" transform="rotate(30)"/>
            <ellipse cx="-12" cy="-18" rx="2.5" ry="4" fill="#ffd3d8" opacity="0.6"/>
            <ellipse cx="14" cy="-15" rx="2" ry="3" fill="#ffd3d8" opacity="0.7"/>
          </g>
        </g>
      `;
    }

    roseSvg.innerHTML = inner;
  }

  function updatePips() {
    pips.forEach((pip, i) => {
      pip.classList.toggle('filled', i < stage);
    });
  }

  // Falling element generator
  function spawnFalling(emoji, count, options = {}) {
    const {
      duration = [4, 8],
      size = [1.5, 3.5],
      delay = 50,
      opacity = [0.6, 1]
    } = options;

    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'falling';
        el.textContent = emoji;
        el.style.left = (Math.random() * 100) + 'vw';
        el.style.fontSize = (size[0] + Math.random() * (size[1] - size[0])) + 'rem';
        const dur = duration[0] + Math.random() * (duration[1] - duration[0]);
        el.style.animationDuration = dur + 's';
        el.style.opacity = opacity[0] + Math.random() * (opacity[1] - opacity[0]);
        el.style.setProperty('--end-rot', (Math.random() * 720 + 360) + 'deg');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 500);
      }, i * delay);
    }
  }

  function spawnRoseShower() {
    const types = ['🌹', '🌹', '🌹', '🌹', '🥀', '❤', '🌷'];
    types.forEach(emoji => {
      spawnFalling(emoji, 14, { delay: 40, duration: [4, 8], size: [1.4, 3] });
    });
  }

  function gentleAmbient() {
    return setInterval(() => {
      const types = ['🌹', '❤', '🌹'];
      const e = types[Math.floor(Math.random() * types.length)];
      spawnFalling(e, 1, { duration: [6, 10], size: [1, 2.2], opacity: [0.4, 0.8] });
    }, 1500);
  }

  let ambientInterval = null;

  function triggerFinale() {
    if (finaleTriggered) return;
    finaleTriggered = true;

    button.style.transition = 'opacity 1s ease, transform 1s ease';
    button.style.opacity = '0';
    button.style.transform = 'translateY(-10px) scale(0.95)';
    document.getElementById('progress').style.transition = 'opacity 1s ease';
    document.getElementById('progress').style.opacity = '0';

    setTimeout(() => {
      button.style.display = 'none';
      document.getElementById('progress').style.display = 'none';
    }, 1000);

    spawnRoseShower();

    setTimeout(() => {
      scene.classList.add('dim');
      finale.classList.add('show');
      replayBtn.classList.add('show');
      ambientInterval = gentleAmbient();
    }, 1800);
  }

  function reset() {
    stage = 0;
    finaleTriggered = false;
    if (ambientInterval) {
      clearInterval(ambientInterval);
      ambientInterval = null;
    }
    document.querySelectorAll('.falling').forEach(el => el.remove());
    finale.classList.remove('show');
    scene.classList.remove('dim');
    replayBtn.classList.remove('show');
    button.style.display = '';
    button.style.opacity = '';
    button.style.transform = '';
    button.classList.remove('bloomed');
    button.textContent = 'click on me to give me love';
    const prog = document.getElementById('progress');
    prog.style.display = '';
    prog.style.opacity = '';
    drawStage(0);
    updatePips();
  }

  // initial render
  drawStage(0);
  updatePips();

  button.addEventListener('click', () => {
    if (stage < STAGES) {
      stage++;
      drawStage(stage);
      updatePips();
      spawnFalling('❤', 2, { duration: [2.5, 4], size: [0.7, 1.4], delay: 80, opacity: [0.5, 0.9] });

      if (stage === 3) {
        button.textContent = 'a little more love...';
      } else if (stage === 4) {
        button.textContent = 'almost in bloom';
      } else if (stage === STAGES) {
        button.textContent = 'one more, for forever';
        button.classList.add('bloomed');
      }
    } else {
      triggerFinale();
    }
  });

  replayBtn.addEventListener('click', reset);
</script>
</body>
</html>
